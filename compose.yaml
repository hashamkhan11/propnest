# Run the production image locally with the demo data:
#   docker compose up --build
# then open http://localhost:8080
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_URL: http://localhost:8080
      ADMIN_PASSWORD: password
      SEED_DEMO: "true"
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
